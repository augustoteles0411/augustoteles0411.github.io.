<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#35452c">
<title>VITTARA | Links</title>
<style>
:root{
  --green:#35452c;
  --green-dark:#29371f;
  --gold:#b7a066;
  --cream:#faf8f2;
  --cream2:#f2ece1;
  --ink:#1d241b;
  --line:#ddd5c5;
  --white:#fffdf8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  color:var(--ink);
  background:
    radial-gradient(circle at 50% 0%,#fffdf8 0%,var(--cream) 43%,var(--cream2) 100%);
  min-height:100vh;
}
.page{
  width:min(100%,560px);
  min-height:100vh;
  margin:auto;
  padding:38px 25px 30px;
  text-align:center;
  display:flex;
  flex-direction:column;
}
.brand{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:var(--green);
}
.brand-mark{
  width:76px;height:90px;
  display:block;
  margin-bottom:2px;
}
.brand-mark svg{width:76px;height:90px}
.brand-word{
  display:block;
  font:400 31px Georgia,serif;
  letter-spacing:5px;
}
.brand-sub{
  display:block;
  margin-top:3px;
  font-size:7px;
  letter-spacing:4px;
  color:#69705f;
}
.divider{
  display:flex;
  align-items:center;
  gap:13px;
  justify-content:center;
  margin:20px 0 12px;
}
.divider span{width:55px;height:1px;background:#b9ad94}
.divider b{
  font-size:9px;
  font-weight:600;
  letter-spacing:3px;
  color:#3f4939;
}
h1{
  font:400 31px Georgia,serif;
  letter-spacing:2px;
  color:var(--green);
  margin:0 0 8px;
}
.bio{
  margin:0 auto 25px;
  max-width:420px;
  color:#555a51;
  font-size:13px;
  line-height:1.55;
}
.socials{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:24px;
}
.socials a{
  width:43px;height:43px;
  border-radius:50%;
  border:1px solid #c9bea8;
  background:var(--white);
  color:var(--green);
  text-decoration:none;
  display:grid;
  place-items:center;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 3px 12px rgba(39,51,33,.07);
}
.links{display:grid;gap:15px}
.link{
  min-height:70px;
  border:1px solid #d8cfbf;
  border-radius:20px;
  background:rgba(255,253,248,.92);
  color:var(--green);
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-size:14px;
  font-weight:bold;
  letter-spacing:1.5px;
  box-shadow:0 5px 18px rgba(39,51,33,.07);
  transition:.2s;
}
.link:hover{
  transform:translateY(-2px);
  border-color:var(--gold);
  box-shadow:0 8px 22px rgba(39,51,33,.11);
}
.link .icon{
  position:absolute;left:22px;
  width:32px;height:32px;
  border-radius:50%;
  display:grid;place-items:center;
  background:var(--green);
  color:#fff;
  font-size:15px;
}
.link .arrow{
  position:absolute;right:22px;
  color:var(--gold);
  font-size:20px;
}
.note{
  margin:24px 0 0;
  color:#69705f;
  font-size:9px;
  letter-spacing:1.3px;
}
.footer{
  margin-top:auto;
  padding-top:58px;
  color:#69705f;
  font-size:8px;
  letter-spacing:2.5px;
}
@media(max-width:480px){
  .page{padding:30px 22px 24px}
  .brand-mark{width:68px;height:80px}
  .brand-mark svg{width:68px;height:80px}
  .brand-word{font-size:28px}
  .link{min-height:67px}
}
</style>
</head>
<body>
<main class="page">
  <a class="brand" href="index.html" aria-label="Abrir site VITTARA">
    <span class="brand-mark">
      <svg viewBox="0 0 52 62" aria-hidden="true">
        <path d="M7 7 L26 56 L45 7 L36 7 L26 35 L16 7 Z"
              fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M30 29 C35 18 42 14 48 12 C45 24 39 31 30 36 C29 34 29 32 30 29Z"
              fill="currentColor"/>
      </svg>
    </span>
    <span class="brand-word">VITTARA</span>
    <span class="brand-sub">MODA FITNESS</span>
  </a>

  <div class="divider"><span></span><b>LINKS OFICIAIS</b><span></span></div>

  <h1>VITTARA Moda Fitness</h1>
  <p class="bio">Conforto, estilo e elegância em movimento.</p>

  <div class="socials">
    <a href="https://wa.me/5582996035020" target="_blank" rel="noopener" aria-label="WhatsApp">◉</a>
    <a href="#" onclick="event.preventDefault();alert('Adicione o link oficial do TikTok da VITTARA neste botão.')" aria-label="TikTok">♪</a>
  </div>

  <section class="links">
    <a class="link" href="https://wa.me/5582996035020" target="_blank" rel="noopener">
      <span class="icon">◉</span>WHATSAPP<span class="arrow">›</span>
    </a>

    <!-- O index.html é o seu projeto completo da VITTARA. -->
    <a class="link" href="index.html" target="_blank" rel="noopener">
      <span class="icon">⌂</span>SITE<span class="arrow">›</span>
    </a>

    <a class="link" href="#" onclick="event.preventDefault();alert('Adicione o link oficial do TikTok da VITTARA neste botão.')">
      <span class="icon">♪</span>TIKTOK<span class="arrow">›</span>
    </a>
  </section>

  <p class="note">CONFORTO • ESTILO • ELEGÂNCIA</p>
  <footer class="footer">VITTARA MODA FITNESS</footer>
</main>
</body>
</html>
